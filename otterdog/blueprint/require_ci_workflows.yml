id: require-ci-workflows
name: Require identical CI workflows
description: >-
  Every spec repo carries the same workflow stubs; the actual CI
  logic lives centrally in the reusable workflows of the osgi/.github repo.
  strict guarantees the pipelines cannot drift between repos — changing the
  central workflow changes CI for all repos at once.
type: required_file
config:
  repo_selector:
    # all spec repos; org.osgi.maven.pom has its own repo-local workflows
    # (it is no reactor and does not follow the spec repo conventions)
    name_pattern: org\.osgi\.(?!maven\.pom).*
  files:
    - path: .github/workflows/build.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # CI logic lives in osgi/.github (reusable workflow).
        # Every push to main deploys a fresh SNAPSHOT to Sonatype Central
        # snapshots; the weekly schedule keeps it fresh in quiet times.
        name: build
        on:
          push:
            branches: [ main ]
          pull_request:
          workflow_dispatch:
          schedule:
            - cron: '23 3 * * 1'
        permissions:
          contents: read
          checks: write
        jobs:
          build:
            uses: osgi/.github/.github/workflows/spec-build.yml@main
            secrets: inherit
            with:
              deploy: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    - path: .github/workflows/release.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # CI logic lives in osgi/.github (reusable workflow).
        # A release is cut by pushing a tag that equals the pom version (no prefix);
        # the central workflow refuses a tag that does not match .mvn/maven.config.
        name: release
        on:
          push:
            tags:
              - '[0-9]*.[0-9]*.[0-9]*'
        jobs:
          release:
            uses: osgi/.github/.github/workflows/spec-release.yml@main
            secrets: inherit
