id: scorecard-analysis
name: OSSF Scorecard analysis
description: >-
  Every org.osgi.* repo runs the OSSF Scorecard workflow and publishes its
  results. The repo only carries this stub; the Scorecard job and its action
  versions live in the reusable workflow scorecard.yml of osgi/.github (the
  Scorecard API verifies that file, see its job_workflow_ref). This is a
  required_file and not a scorecard_integration blueprint: otterdog's
  scorecard_integration only recognises a direct ossf/scorecard-action step
  and would keep proposing the inline workflow for a stub. The id had to
  change as well: otterdog keeps the type in the primary key of a blueprint
  and never updates it, so the old id stayed a scorecard_integration
  blueprint. Under the new id it is inserted fresh with the right type.
type: required_file
config:
  repo_selector:
    name_pattern: org\.osgi\..*
  files:
    - path: .github/workflows/scorecard-analysis.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # Scorecard logic lives in osgi/.github (reusable workflow).
        name: Scorecard analysis
        on:
          branch_protection_rule:
          schedule:
            - cron: '43 5 * * 2'
          push:
            branches: [ main ]
        permissions: read-all
        jobs:
          analysis:
            permissions:
              security-events: write
              id-token: write
            uses: osgi/.github/.github/workflows/scorecard.yml@main
