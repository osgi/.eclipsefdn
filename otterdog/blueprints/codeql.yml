# Touched again on purpose: otterdog only stores a changed file content
# when the description of the blueprint did not change in the same
# commit (update_or_create_blueprint short-circuits on the first change
# it finds). The stub content below reached the repos only after this
# second commit; do not change the description and the content together.
id: codeql-analysis
name: CodeQL analysis
description: >-
  Every spec repo runs CodeQL static analysis over its Java sources on
  pushes, pull requests and a weekly schedule (Scorecard SAST check).
  The repo only carries this stub; the CodeQL job and its action versions
  live in the reusable workflow codeql.yml of osgi/.github, kept current by
  Dependabot there. build-mode none needs no working Maven build.
type: required_file
config:
  repo_selector:
    # spec repos only; org.osgi.maven.pom contains no Java sources and
    # CodeQL fails a run that finds no code for the requested language
    name_pattern: org\.osgi\.(?!maven\.pom).*
  files:
    - path: .github/workflows/codeql.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # CodeQL logic lives in osgi/.github (reusable workflow).
        name: CodeQL
        on:
          push:
            branches: [ main ]
          pull_request:
            branches: [ main ]
          schedule:
            - cron: '17 4 * * 3'
        permissions:
          contents: read
        jobs:
          analyze:
            permissions:
              contents: read
              security-events: write
            uses: osgi/.github/.github/workflows/codeql.yml@main
