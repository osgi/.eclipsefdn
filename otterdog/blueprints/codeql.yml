id: codeql-analysis
name: CodeQL analysis
description: >-
  Every spec repo runs CodeQL static analysis over its Java sources on
  pushes, pull requests and a weekly schedule (Scorecard SAST check).
  build-mode none needs no working Maven build.
type: required_file
config:
  repo_selector:
    # spec repos only; org.osgi.maven.pom contains no Java sources and
    # CodeQL fails a run that finds no code for the requested language
    name_pattern: org\.osgi\.(?!maven\.pom).*
  files:
    - path: .github/workflows/codeql.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        name: CodeQL
        on:
          push:
            branches: [ main ]
          pull_request:
            branches: [ main ]
          schedule:
            - cron: '17 4 * * 3'
        permissions:
          contents: read
        jobs:
          analyze:
            runs-on: ubuntu-latest
            permissions:
              contents: read
              security-events: write
            steps:
              - name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                  persist-credentials: false
              - name: Initialize CodeQL
                uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
                with:
                  languages: java
                  build-mode: none
              - name: Analyze
                uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
                with:
                  category: "/language:java"
