id: require-dependabot
name: Require the Dependabot configuration of the spec repos
description: >-
  Every org.osgi.* repo (spec repos and the parent pom) gets the same
  Dependabot configuration: Maven only, with the JUnit updates in one group,
  and without the api and spec modules, whose dependencies are the versions
  the API really needs.
  The workflows of the repos are stubs from otterdog blueprints; every action
  version lives in the reusable workflows of osgi/.github and is updated by
  Dependabot there, not in the repos.
type: required_file
config:
  repo_selector:
    name_pattern: '(org\.osgi\..*|osgi\.(annotation|cmpn|core|promise))'
  files:
    - path: .github/dependabot.yml
      strict: true
      content: |
        # Dependabot watches the Maven build; some dependency versions are
        # managed by the parent pom (org.osgi:org.osgi.maven.pom.parent).
        # The workflows are stubs from otterdog blueprints: their actions
        # live in osgi/.github and are updated there, not here.
        version: 2
        updates:
          - package-ecosystem: maven
            directory: "/"
            schedule:
              interval: weekly
            # The API states the versions it really needs; they change with
            # the API, not with every new release. The spec module compiles
            # the same sources with the same dependencies.
            exclude-paths:
              - "api/**"
              - "spec/**"
            # The TCK tests the API in the versions the specification
            # states: only external dependencies are updated. The support
            # artifacts of the TCK (org.osgi.tck) are updated, and so is
            # osgi-test (org.osgi:org.osgi.test.*).
            ignore:
              - dependency-name: "org.osgi:org.osgi.annotation.*"
              - dependency-name: "org.osgi:org.osgi.dto"
              - dependency-name: "org.osgi:org.osgi.framework"
              - dependency-name: "org.osgi:org.osgi.impl.*"
              - dependency-name: "org.osgi:org.osgi.namespace.*"
              - dependency-name: "org.osgi:org.osgi.resource"
              - dependency-name: "org.osgi:org.osgi.service.*"
              - dependency-name: "org.osgi:org.osgi.util.*"
            groups:
              # Jupiter and Platform only work together: one pull request
              junit:
                patterns:
                  - "org.junit*"

