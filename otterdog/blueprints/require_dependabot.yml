id: require-dependabot
name: Require the Dependabot configuration of the spec repos
description: >-
  Every spec repo gets the same Dependabot configuration: Maven only, with
  the JUnit updates in one group. The workflows of the spec repos come from
  otterdog blueprints, so their actions are updated in these blueprints and
  not by Dependabot in the repos. org.osgi.maven.pom has repo-local workflows
  and keeps its own configuration.
type: required_file
config:
  repo_selector:
    name_pattern: org\.osgi\.(?!maven\.pom).*
  files:
    - path: .github/dependabot.yml
      strict: true
      content: |
        # Dependabot watches the Maven build; some dependency versions are
        # managed by the parent pom (org.osgi:org.osgi.maven.pom.parent).
        # The workflows come from otterdog blueprints: their actions are
        # updated in osgi/.eclipsefdn, not here.
        version: 2
        updates:
          - package-ecosystem: maven
            directory: "/"
            schedule:
              interval: weekly
            groups:
              # Jupiter and Platform only work together: one pull request
              junit:
                patterns:
                  - "org.junit*"

