id: require-ci-workflows-pom
name: Require the CI workflow stubs of the parent pom
description: >-
  org.osgi.maven.pom uses the same central reusable workflows as the spec
  repos (osgi/.github spec-build.yml and spec-release.yml), so every action
  version lives in one place. Its stubs differ from require-ci-workflows in
  one line only: structure: false, because the parent pom is no reactor with
  .mvn/maven.config revision and TCK runs.
type: required_file
config:
  repo_selector:
    name_pattern: org\.osgi\.maven\.pom
  files:
    - path: .github/workflows/build.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # CI logic lives in osgi/.github (reusable workflow).
        # Every push to main deploys a fresh SNAPSHOT to Sonatype Central
        # snapshots; the weekly schedule keeps it fresh in quiet times.
        name: build
        on:
          push:
            branches: [ main ]
          pull_request:
          workflow_dispatch:
          schedule:
            - cron: '23 3 * * 1'
        permissions:
          contents: read
        jobs:
          build:
            permissions:
              contents: read
              # the TCK test report is published as a check run
              checks: write
            uses: osgi/.github/.github/workflows/spec-build.yml@main
            secrets: inherit
            with:
              # the parent pom is no reactor: no spec repo structure checks
              structure: false
              deploy: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    - path: .github/workflows/release.yml
      strict: true
      content: |
        # Managed by otterdog blueprint {{blueprint_id}}. Do not edit here.
        # CI logic lives in osgi/.github (reusable workflow).
        # A release is cut by pushing a tag that equals the pom version (no prefix);
        # the central workflow refuses a tag that does not match the pom version.
        name: release
        on:
          push:
            tags:
              - '[0-9]*.[0-9]*.[0-9]*'
        permissions:
          contents: read
        jobs:
          release:
            uses: osgi/.github/.github/workflows/spec-release.yml@main
            secrets: inherit
